# Claude picks up issues and comments that mention @claude, such as bug
# reports the admin published from the app, and opens a pull request.
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (run /install-github-app in Claude
# Code, or see README "Bug reports"). Without it, nothing runs.
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check that Claude is set up
        id: setup
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "No CLAUDE_CODE_OAUTH_TOKEN secret: skipped"; fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ok == '1'
      - uses: anthropics/claude-code-action@v1
        if: steps.setup.outputs.ok == '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
