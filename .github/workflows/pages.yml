# Pull requests: unit tests and the full end-to-end suite against a real
# Bitcoin Knots (BLAKE2b) regtest node, in three browsers, split in parallel
# shards. A main push whose exact source tree already passed all of that in a
# pull request goes straight to build and deploy; any other push runs the
# full suite first.
#
# Set the repository variable VITE_ADMIN_NPUB (Settings → Secrets and variables
# → Actions → Variables) to the npub that approves arbiters.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KNOTS_VERSION: 29.4.2.knots20260508

jobs:
  # Was this exact source tree already tested by a passing pull request run?
  tested:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tree: ${{ steps.check.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          echo "tree=$tree" >> $GITHUB_OUTPUT
          skip=false
          if [ "${{ github.event_name }}" = push ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=tested-$tree" --jq '[.artifacts[]|select(.expired|not)]|length')
            [ "$n" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> $GITHUB_OUTPUT
          echo "tree $tree already tested: $skip"

  unit:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    # Every browser test runs three times: Firefox on a desktop screen, Firefox
    # on a phone-sized screen, and Chrome emulating an Android phone. Each of
    # those is split in three shards that run at the same time.
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    name: e2e (${{ matrix.browser }}, ${{ matrix.device }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chrome]
        device: [desktop, phone]
        shard: [escrow, plan, other]
        exclude:
          - { browser: chrome, device: desktop }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOBILE: ${{ matrix.device == 'phone' && '1' || '' }}
      KNOTS_CLI: bitcoin-cli -regtest -datadir=${{ github.workspace }}/../regtest -rpcuser=u -rpcpassword=p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pick the browser
        run: |
          echo "PROFILE_DIR=$RUNNER_TEMP" >> $GITHUB_ENV
          echo "SHOTS=$RUNNER_TEMP/shots" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/shots"
          if [ "${{ matrix.browser }}" = chrome ]; then echo "CHROME=$(which google-chrome)" >> $GITHUB_ENV; else echo "FIREFOX=$(which firefox)" >> $GITHUB_ENV; fi

      - name: Cache Bitcoin Knots
        id: knots
        uses: actions/cache@v4
        with:
          path: bitcoin-${{ env.KNOTS_VERSION }}
          key: knots-${{ env.KNOTS_VERSION }}

      - name: Install Bitcoin Knots (checksum verified)
        if: steps.knots.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/bitcoinknots/bitcoin/releases/download/v$KNOTS_VERSION
          file=bitcoin-$KNOTS_VERSION-x86_64-linux-gnu.tar.gz
          curl -sSfLO $base/$file
          curl -sSfLO $base/SHA256SUMS
          grep " $file\$" SHA256SUMS | sha256sum -c -
          tar xzf $file

      - name: Start regtest node with BLAKE2b active from block 1
        run: |
          echo "$PWD/bitcoin-$KNOTS_VERSION/bin" >> $GITHUB_PATH
          export PATH="$PWD/bitcoin-$KNOTS_VERSION/bin:$PATH"
          mkdir -p ../regtest
          bitcoind -regtest -datadir=$PWD/../regtest -testactivationheight=blake2b@1 \
            -rpcuser=u -rpcpassword=p -fallbackfee=0.0001 -txindex=1 -daemon
          for i in $(seq 30); do bitcoin-cli -regtest -datadir=$PWD/../regtest -rpcuser=u -rpcpassword=p getblockcount && break; sleep 1; done
          # Every shard starts with its own wallet and spendable coins.
          cli="bitcoin-cli -regtest -datadir=$PWD/../regtest -rpcuser=u -rpcpassword=p"
          $cli createwallet w > /dev/null
          $cli generatetoaddress 101 $($cli getnewaddress) > /dev/null

      - name: Build app and start relay, Esplora shim, shop fixtures, service, preview
        run: |
          VITE_API_URL=http://127.0.0.1:8787 npm run build
          nohup npm run sendcloud > sendcloud.log 2>&1 &
          ADMIN_NPUB=$(node test/e2e/testplan.e2e.mjs --admin-npub) nohup npm run service:dev > service.log 2>&1 &
          nohup npm run relay > relay.log 2>&1 &
          nohup npm run shim > shim.log 2>&1 &
          nohup npm run fixtures > fixtures.log 2>&1 &
          nohup npm run wallets > wallets.log 2>&1 &
          nohup npm run blossom > blossom.log 2>&1 &
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for url in http://127.0.0.1:4173/ http://127.0.0.1:3006/api/blocks/tip/height http://127.0.0.1:8787/; do
            for i in $(seq 30); do curl -sf $url > /dev/null && break; sleep 1; done
          done

      # Shard "escrow": the escrow against the node and the full trades through the UI.
      - name: Escrow against the real node
        if: matrix.shard == 'escrow'
        run: npm run test:regtest
      - name: Full trade, dispute and deadlines through the UI
        if: matrix.shard == 'escrow'
        run: npm run test:e2e

      # Shard "other": import, Lightning, direct purchases, settings.
      - name: Import button and pasted links against Marktplaats / Vinted / eBay fixtures
        if: matrix.shard == 'other'
        env:
          API: '1'
        run: npm run test:import
      - name: Lightning wallet link (mock NWC wallets)
        if: matrix.shard == 'other'
        run: npm run test:lightning
      - name: Direct Lightning purchase with a prepaid label through the UI
        if: matrix.shard == 'other'
        run: npm run test:direct
      - name: Settings, node picker, AI assistant, escrow advice through the UI
        if: matrix.shard == 'other'
        run: npm run test:extras

      # Shard "plan": the manual test plan, walked through automatically.
      - name: The manual test plan, walked through automatically
        if: matrix.shard == 'plan'
        run: |
          VITE_API_URL=http://127.0.0.1:8787 VITE_ADMIN_NPUB=$(node test/e2e/testplan.e2e.mjs --admin-npub) npx vite build --outDir dist-plan
          nohup npx vite preview --outDir dist-plan --port 4174 --strictPort > preview-plan.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          APP_URL=http://127.0.0.1:4174/ npm run test:plan

      - name: Screenshot report
        if: always()
        run: node scripts/proof-report.mjs $SHOTS $SHOTS/report.html || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.browser }}-${{ matrix.device }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shots
            *.log

  # Marks this source tree as fully tested, so its merge to main can deploy at once.
  mark-tested:
    needs: [tested, unit, e2e]
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.tested.outputs.tree }}" > tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-${{ needs.tested.outputs.tree }}
          path: tree.txt
          retention-days: 30

  build:
    needs: [tested, unit, e2e]
    # Only main is published, once its tree passed everything (here or in its pull request).
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.tested.outputs.skip == 'true' || (needs.unit.result == 'success' && needs.e2e.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The XBT Market service (usernames, shipping labels, import from a link, bug reports)
      # on Cloudflare Workers. Runs only when the repository has the secrets
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README "Service");
      # without them the app is built without those features.
      - name: Deploy the XBT Market service
        id: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENDCLOUD_PUBLIC_KEY: ${{ secrets.SENDCLOUD_PUBLIC_KEY }}
          SENDCLOUD_SECRET_KEY: ${{ secrets.SENDCLOUD_SECRET_KEY }}
          PLATFORM_LN_ADDRESS: ${{ secrets.PLATFORM_LN_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUG_REPORT_EMAIL: ${{ secrets.BUG_REPORT_EMAIL }}
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          ISSUES_REPO: ${{ github.repository }}
          ADMIN_NPUB: ${{ vars.VITE_ADMIN_NPUB }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: service not deployed"; exit 0; fi
          cd server
          npx --yes wrangler@4 deploy | tee deploy.log
          for k in SENDCLOUD_PUBLIC_KEY SENDCLOUD_SECRET_KEY PLATFORM_LN_ADDRESS RESEND_API_KEY BUG_REPORT_EMAIL ISSUES_TOKEN ISSUES_REPO ADMIN_NPUB; do
            if [ -n "${!k}" ]; then printf '%s' "${!k}" | npx --yes wrangler@4 secret put $k; fi
          done
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> $GITHUB_OUTPUT
      - run: npm run build
        env:
          VITE_ADMIN_NPUB: ${{ vars.VITE_ADMIN_NPUB }}
          # A repository variable wins (e.g. a custom domain for the service).
          VITE_API_URL: ${{ vars.VITE_API_URL || steps.service.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The test jobs before build may be skipped (tree already tested); deploy whenever build succeeded.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
