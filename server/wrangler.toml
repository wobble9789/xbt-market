# XBT Market service on Cloudflare Workers (free plan is enough).
# Deployed by .github/workflows/pages.yml when the repository has the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; see README "Service".
name = "xbt-market"
main = "worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# Push notifications for saved searches: look for new listings every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]
